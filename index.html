<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen Recipe Book</title>
<meta name="theme-color" content="#b4472b">
<style>
:root{
  --bg:#f6f3ee; --surface:#ffffff; --surface-2:#faf8f4; --ink:#1f1b16; --muted:#6b6258;
  --line:#e3ddd3; --accent:#b4472b; --accent-ink:#ffffff; --accent-soft:#f6e3dc;
  --good:#2f7a4a; --warn:#b07a12; --bad:#b4302b; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130f; --surface:#211d18; --surface-2:#1b1814; --ink:#f1ece4; --muted:#a69c90;
    --line:#38322a; --accent:#e0714f; --accent-ink:#1a0f0a; --accent-soft:#3a241b;
    --good:#5fbf80; --warn:#e0b04a; --bad:#ef6a5f; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#16130f; --surface:#211d18; --surface-2:#1b1814; --ink:#f1ece4; --muted:#a69c90;
  --line:#38322a; --accent:#e0714f; --accent-ink:#1a0f0a; --accent-soft:#3a241b;
  --good:#5fbf80; --warn:#e0b04a; --bad:#ef6a5f; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- Header ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand .dot{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:15px}
.search{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.icon{padding:8px 10px}

.tabs{max-width:1100px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface-2);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.tab.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tab .n{opacity:.6;margin-left:4px;font-weight:500}

main{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar .info{color:var(--muted);font-size:13px;margin-right:auto}

/* ---------- Grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;position:relative}
.card .ph{aspect-ratio:4/3;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:13px;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.card .cat{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}
.card .nm{font-weight:700;font-size:16px;line-height:1.3}
.card .en{color:var(--muted);font-size:13px}
.card .nums{display:flex;gap:10px;margin-top:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.card .nums b{color:var(--ink);font-variant-numeric:tabular-nums}
.card .sel{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:7px;border:2px solid #fff;background:rgba(0,0,0,.35);display:none;place-items:center;color:#fff;font-weight:700}
body.selecting .card .sel{display:grid}
.card.picked .sel{background:var(--accent);border-color:var(--accent)}
.card.picked{outline:3px solid var(--accent)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-weight:700;font-size:11px}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}

.empty{text-align:center;padding:60px 16px;color:var(--muted)}
.empty h2{color:var(--ink);margin:0 0 6px;font-size:18px}

/* ---------- Sheet (modal) ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(20,15,10,.45);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:24px 12px}
.sheet{background:var(--bg);width:100%;max-width:820px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.25);overflow:hidden}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;align-items:center}
.sheet-head h2{margin:0 auto 0 0;font-size:17px}
.sheet-body{padding:16px}
@media (max-width:600px){.sheet-wrap{padding:0}.sheet{border-radius:0;min-height:100%}}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.sec h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.sec h3 small{color:var(--muted);font-weight:500}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:600px){.row{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea,.inp{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:15px;font-weight:400;color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}

.photo-box{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.photo-prev{width:200px;max-width:100%;aspect-ratio:4/3;border-radius:10px;border:1px dashed var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:13px;overflow:hidden}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.photo-actions{display:flex;flex-direction:column;gap:8px}

/* ingredient table */
.itable{width:100%;border-collapse:collapse}
.itable th{font-size:11px;color:var(--muted);text-align:left;font-weight:700;padding:0 4px 6px}
.itable td{padding:3px 4px;vertical-align:middle}
.itable .inp{padding:7px 8px;font-size:14px}
.itable .num{text-align:right;font-variant-numeric:tabular-nums}
.itable .x{border:none;background:none;color:var(--muted);font-size:18px;padding:4px 6px}
@media (max-width:600px){
  .itable thead{display:none}
  .itable tr{display:grid;grid-template-columns:1fr 1fr 70px 80px 30px;gap:4px;padding:6px 0;border-bottom:1px solid var(--line)}
  .itable td{padding:0}
  .itable td.c-name{grid-column:1/-1}
  .itable td.c-en{grid-column:1/3}
}
.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
@media (max-width:600px){.totals{grid-template-columns:repeat(2,1fr)}}
.tot{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tot .k{font-size:11px;color:var(--muted);font-weight:700}
.tot .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}

.list-edit{display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:28px 1fr 30px;gap:8px;align-items:start}
.step .no{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px;margin-top:4px}
.step .tx{display:flex;flex-direction:column;gap:4px}
.step textarea{min-height:44px}
.step .ctl{display:flex;flex-direction:column}
.step .ctl button{border:none;background:none;color:var(--muted);padding:2px;font-size:14px}

/* ---------- Detail view ---------- */
.dv-hero{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
@media (max-width:600px){.dv-hero{grid-template-columns:1fr}}
.dv-photo{border-radius:12px;overflow:hidden;background:var(--surface-2);aspect-ratio:4/3;display:grid;place-items:center;color:var(--muted)}
.dv-photo img{width:100%;height:100%;object-fit:cover}
.dv-title .cat{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.05em}
.dv-title h1{margin:2px 0 0;font-size:24px;line-height:1.25}
.dv-title .en{color:var(--muted);font-size:16px}
.dv-meta{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{list-style:none;margin:0;padding:0}
.kv li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.kv li:last-child{border-bottom:none}
.kv li span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.ol{margin:0;padding-left:22px}
.ol li{margin-bottom:8px}
.ol .en{color:var(--muted);font-size:13px}

/* ---------- Settings ---------- */
.cat-row{display:grid;grid-template-columns:1fr 1fr auto auto auto;gap:6px;align-items:center;margin-bottom:6px}
@media (max-width:600px){.cat-row{grid-template-columns:1fr 1fr auto}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;z-index:100;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.fabs{position:fixed;right:18px;bottom:18px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab{border-radius:999px;padding:14px 20px;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.scan-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:12px 0}
.scan-thumbs figure{margin:0;position:relative;aspect-ratio:3/4;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.scan-thumbs img{width:100%;height:100%;object-fit:cover}
.scan-thumbs button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff}
.spinner{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px}

/* =========================================================
   PRINT — Half Letter 5.5in x 8.5in (default) / Letter / A5
   ========================================================= */
#print-root{display:none}
@media print{
  html,body{background:#fff!important;color:#000!important}
  body > *:not(#print-root){display:none!important}
  #print-root{display:block!important}
  .pg{page-break-after:always;break-after:page;overflow:hidden;color:#000;font-size:8.6pt;line-height:1.35;display:flex;flex-direction:column}
  .pg:last-child{page-break-after:auto;break-after:auto}
}
.pg{background:#fff;color:#000;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
.pg .p-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2pt solid #000;padding-bottom:3pt;margin-bottom:5pt}
.pg .p-cat{font-size:7pt;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1pt solid #000;padding:1pt 5pt;border-radius:2pt}
.pg .p-name{font-size:15pt;font-weight:800;line-height:1.15}
.pg .p-en{font-size:9pt;color:#333}
.pg .p-top{display:grid;grid-template-columns:52% 1fr;gap:7pt;margin-bottom:6pt}
.pg .p-photo{width:100%;aspect-ratio:4/3;border:0.5pt solid #999;overflow:hidden;display:grid;place-items:center;color:#999;font-size:7pt}
.pg .p-photo img{width:100%;height:100%;object-fit:cover}
.pg h4{font-size:8pt;margin:5pt 0 2pt;padding:1pt 4pt;background:#000;color:#fff;letter-spacing:.04em;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg table{width:100%;border-collapse:collapse}
.pg td,.pg th{border-bottom:0.5pt solid #bbb;padding:1.5pt 2pt;text-align:left;vertical-align:top}
.pg th{font-size:6.8pt;color:#444;border-bottom:0.8pt solid #000}
.pg .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pg .muted{color:#555}
.pg ol{margin:0;padding-left:13pt}
.pg ol li{margin-bottom:2.5pt}
.pg .cost-box{border:0.8pt solid #000;padding:3pt 4pt}
.pg .cost-box div{display:flex;justify-content:space-between}
.pg .cost-box .big{font-weight:800;font-size:9.5pt}
.pg .p-foot{margin-top:auto;padding-top:3pt;border-top:0.5pt solid #999;font-size:6.5pt;color:#555;display:flex;justify-content:space-between}
.pg .serve{display:flex;flex-wrap:wrap;gap:2pt 8pt;margin:0;padding:0;list-style:none}
.pg .serve li::before{content:"☐ "}
</style>
<style id="page-size">@page{size:5.5in 8.5in;margin:0.3in}</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand"><span class="dot">R</span><span>レシピ帳 <small style="color:var(--muted);font-weight:500">Recipe Book</small></span></div>
    <input id="q" class="search" type="search" placeholder="検索 / Search（料理名・食材）">
    <button class="btn icon" id="btn-settings" title="設定">⚙︎ 設定</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <div class="toolbar">
    <div class="info" id="info"></div>
    <button class="btn sm" id="btn-select">まとめて印刷</button>
    <button class="btn sm primary hidden" id="btn-print-sel">選択したレシピを印刷</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty hidden" id="empty">
    <h2>まだレシピがありません</h2>
    <p>右下の「＋ 新しいレシピ」から登録してください。<br>サンプルを入れて試すこともできます。</p>
    <button class="btn" id="btn-sample">サンプルレシピを入れる</button>
  </div>
</main>

<div class="fabs">
  <button class="btn fab" id="btn-scan">📷 写真から作る</button>
  <button class="btn primary fab" id="btn-new">＋ 新しいレシピ</button>
</div>

<div id="sheet" class="sheet-wrap hidden"></div>
<div id="print-root"></div>
<input type="file" id="file-import" accept="application/json,.json" class="hidden">

<script>
"use strict";
/* ============================================================
   Storage (IndexedDB, with in-memory fallback)
   ============================================================ */
const DB_NAME = "recipe-book", DB_VER = 1;
let dbp = null, memStore = { recipes: new Map(), kv: new Map() }, useMem = false;
function openDB(){
  if (dbp) return dbp;
  dbp = new Promise((res) => {
    try{
      const r = indexedDB.open(DB_NAME, DB_VER);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains("recipes")) db.createObjectStore("recipes", { keyPath: "id" });
        if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => { useMem = true; res(null); };
    }catch(e){ useMem = true; res(null); }
  });
  return dbp;
}
async function tx(store, mode, fn){
  const db = await openDB();
  if (!db || useMem){
    const m = memStore[store];
    return fn({
      get:k=>m.get(k), put:(v,k)=>m.set(k ?? v.id, v), delete:k=>m.delete(k), getAll:()=>[...m.values()]
    });
  }
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode), s = t.objectStore(store);
    let out;
    const wrap = {
      get:k=>new Promise(r=>{const q=s.get(k);q.onsuccess=()=>r(q.result);}),
      put:(v,k)=>k===undefined?s.put(v):s.put(v,k),
      delete:k=>s.delete(k),
      getAll:()=>new Promise(r=>{const q=s.getAll();q.onsuccess=()=>r(q.result);})
    };
    Promise.resolve(fn(wrap)).then(v=>out=v);
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
  });
}
const Store = {
  all: () => tx("recipes","readonly", s=>s.getAll()),
  put: r => tx("recipes","readwrite", s=>{ s.put(r); }),
  del: id => tx("recipes","readwrite", s=>{ s.delete(id); }),
  getKV: k => tx("kv","readonly", s=>s.get(k)),
  setKV: (k,v) => tx("kv","readwrite", s=>{ s.put(v,k); }),
};

/* ============================================================
   State
   ============================================================ */
const DEFAULT_CATS = [
  { id:"appetizer", ja:"アペタイザー", en:"Appetizer" },
  { id:"salad",     ja:"サラダ",       en:"Salad" },
  { id:"fried",     ja:"揚げ物",       en:"Fried" },
  { id:"grill",     ja:"焼き物",       en:"Grill" },
  { id:"main",      ja:"メイン",       en:"Main" },
  { id:"rice",      ja:"ご飯・麺",     en:"Rice & Noodles" },
  { id:"sushi",     ja:"寿司・刺身",   en:"Sushi & Sashimi" },
  { id:"dessert",   ja:"デザート",     en:"Dessert" },
  { id:"drink",     ja:"ドリンク",     en:"Drink" },
  { id:"prep",      ja:"仕込み・ソース", en:"Prep & Sauce" },
];
const DEFAULT_SETTINGS = {
  shop: "", currency: "$", decimals: 2, paper: "half", printCost: true,
  targetRate: 30, categories: DEFAULT_CATS, theme: "auto"
};
const state = { recipes: [], settings: structuredClone(DEFAULT_SETTINGS), cat: "all", q: "", selecting: false, picked: new Set() };

/* ============================================================
   Helpers
   ============================================================ */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const num = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g,"")); return isFinite(n) ? n : 0; };
const money = v => { const s = state.settings; return s.currency + num(v).toLocaleString(undefined,{minimumFractionDigits:s.decimals,maximumFractionDigits:s.decimals}); };
const pct = v => isFinite(v) ? (Math.round(v*10)/10).toFixed(1) + "%" : "—";
const catOf = id => state.settings.categories.find(c=>c.id===id) || { id, ja:"未分類", en:"Uncategorized" };
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

function calc(r){
  const ingCost = (r.ingredients||[]).reduce((a,i)=>a+num(i.cost),0);
  const yieldN = Math.max(1, num(r.yield) || 1);
  const extra = num(r.extraCost);
  const cost = ingCost / yieldN + extra;
  const price = num(r.price);
  const rate = price > 0 ? cost / price * 100 : NaN;
  const profit = price - cost;
  return { ingCost, cost, price, rate, profit, yieldN };
}
function rateClass(rate){
  if (!isFinite(rate)) return "";
  const t = num(state.settings.targetRate) || 30;
  return rate <= t ? "good" : rate <= t + 8 ? "warn" : "bad";
}
function blankRecipe(){
  return { id: uid(), nameJa:"", nameEn:"", category: state.cat !== "all" ? state.cat : (state.settings.categories[0]?.id||""),
    photo:"", yield:1, price:"", extraCost:"", prepTime:"", allergens:"", notes:"",
    ingredients:[{name:"",nameEn:"",qty:"",unit:"",cost:""}], steps:[{ja:"",en:""}], serving:[""],
    createdAt: Date.now(), updatedAt: Date.now() };
}

/* Resize + compress photo so storage stays small */
function fileToDataURL(file, max=1400, q=0.82){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let { width:w, height:h } = img;
      const k = Math.min(1, max / Math.max(w,h));
      w = Math.round(w*k); h = Math.round(h*k);
      const c = document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("画像を読み込めませんでした")); };
    img.src = url;
  });
}

/* ============================================================
   Rendering: tabs + grid
   ============================================================ */
function filtered(){
  const q = state.q.trim().toLowerCase();
  return state.recipes
    .filter(r => state.cat === "all" || r.category === state.cat)
    .filter(r => !q || [r.nameJa, r.nameEn, r.notes, ...(r.ingredients||[]).flatMap(i=>[i.name,i.nameEn])].join(" ").toLowerCase().includes(q))
    .sort((a,b) => (a.nameJa||a.nameEn||"").localeCompare(b.nameJa||b.nameEn||"", "ja"));
}
function renderTabs(){
  const counts = {}; state.recipes.forEach(r => counts[r.category] = (counts[r.category]||0)+1);
  const items = [{ id:"all", ja:"すべて", n: state.recipes.length }, ...state.settings.categories.map(c=>({ ...c, n: counts[c.id]||0 }))];
  $("#tabs").innerHTML = items.map(c => `<button class="tab ${state.cat===c.id?"on":""}" data-cat="${esc(c.id)}">${esc(c.ja)}<span class="n">${c.n}</span></button>`).join("");
}
function renderGrid(){
  const list = filtered();
  document.body.classList.toggle("selecting", state.selecting);
  $("#btn-select").textContent = state.selecting ? "選択をやめる" : "まとめて印刷";
  $("#btn-print-sel").classList.toggle("hidden", !state.selecting);
  $("#btn-print-sel").textContent = `選択したレシピを印刷（${state.picked.size}）`;
  $("#info").textContent = `${list.length} 件のレシピ` + (state.cat!=="all" ? `（${catOf(state.cat).ja}）` : "");
  $("#empty").classList.toggle("hidden", state.recipes.length > 0);
  $("#grid").innerHTML = list.map(r => {
    const c = calc(r), cat = catOf(r.category);
    return `<article class="card ${state.picked.has(r.id)?"picked":""}" data-id="${esc(r.id)}">
      <div class="sel">${state.picked.has(r.id)?"✓":""}</div>
      <div class="ph">${r.photo ? `<img src="${r.photo}" alt="" loading="lazy">` : "写真なし"}</div>
      <div class="bd">
        <div class="cat">${esc(cat.ja)} · ${esc(cat.en)}</div>
        <div class="nm">${esc(r.nameJa || "（名前未入力）")}</div>
        ${r.nameEn ? `<div class="en">${esc(r.nameEn)}</div>` : ""}
        <div class="nums">
          <span>原価 <b>${money(c.cost)}</b></span>
          <span>売値 <b>${c.price ? money(c.price) : "—"}</b></span>
          ${isFinite(c.rate) ? `<span class="pill ${rateClass(c.rate)}">原価率 ${pct(c.rate)}</span>` : ""}
        </div>
      </div>
    </article>`;
  }).join("");
}
function render(){ renderTabs(); renderGrid(); }

/* ============================================================
   Sheet (modal) helpers
   ============================================================ */
function openSheet(html){
  const s = $("#sheet"); s.innerHTML = `<div class="sheet">${html}</div>`; s.classList.remove("hidden");
  document.body.style.overflow = "hidden"; s.scrollTop = 0;
}
function closeSheet(){ $("#sheet").classList.add("hidden"); $("#sheet").innerHTML=""; document.body.style.overflow=""; }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").classList.contains("hidden")) closeSheet(); });

/* ============================================================
   Editor
   ============================================================ */
function showEditor(src, isNew){
  const r = structuredClone(src || blankRecipe());
  isNew = isNew || !state.recipes.some(x=>x.id===r.id);
  const catOpts = () => state.settings.categories.map(c=>`<option value="${esc(c.id)}" ${c.id===r.category?"selected":""}>${esc(c.ja)} / ${esc(c.en)}</option>`).join("");

  const ingRow = (i, idx) => `<tr data-i="${idx}">
    <td class="c-name"><input class="inp" data-f="name" placeholder="材料名（例：鶏もも肉）" value="${esc(i.name)}"></td>
    <td class="c-en"><input class="inp" data-f="nameEn" placeholder="English" value="${esc(i.nameEn)}"></td>
    <td><input class="inp num" data-f="qty" placeholder="分量" value="${esc(i.qty)}" inputmode="decimal"></td>
    <td><input class="inp" data-f="unit" placeholder="単位" value="${esc(i.unit)}" style="width:64px"></td>
    <td><input class="inp num" data-f="cost" placeholder="原価" value="${esc(i.cost)}" inputmode="decimal" style="width:80px"></td>
    <td><button class="x" data-act="ing-del" title="削除">×</button></td></tr>`;
  const stepRow = (s, idx) => `<div class="step" data-i="${idx}">
    <div class="no">${idx+1}</div>
    <div class="tx"><textarea class="inp" data-f="ja" placeholder="手順（日本語）">${esc(s.ja)}</textarea>
    <textarea class="inp" data-f="en" placeholder="English (optional)" style="min-height:36px">${esc(s.en)}</textarea></div>
    <div class="ctl"><button data-act="step-up" title="上へ">▲</button><button data-act="step-down" title="下へ">▼</button><button data-act="step-del" title="削除">×</button></div></div>`;
  const servRow = (s, idx) => `<div style="display:flex;gap:6px" data-i="${idx}"><input class="inp" data-f="serv" placeholder="例：黒い角皿、レモン1/8、ポン酢小皿" value="${esc(s)}"><button class="btn sm" data-act="serv-del">×</button></div>`;

  openSheet(`
    <div class="sheet-head">
      <button class="btn icon" data-act="cancel">✕</button>
      <h2>${isNew?"新しいレシピ":"レシピを編集"}</h2>
      <button class="btn primary" data-act="save">保存</button>
    </div>
    <div class="sheet-body" id="ed">
      <div class="sec"><h3>基本情報</h3>
        <div class="row">
          <label class="f">料理名（日本語）<input id="e-nameJa" value="${esc(r.nameJa)}" placeholder="例：唐揚げ"></label>
          <label class="f">料理名（English）<input id="e-nameEn" value="${esc(r.nameEn)}" placeholder="e.g. Chicken Karaage"></label>
          <label class="f">カテゴリー<select id="e-cat">${catOpts()}</select></label>
          <label class="f">調理時間（任意）<input id="e-time" value="${esc(r.prepTime)}" placeholder="例：15分"></label>
        </div>
      </div>

      <div class="sec"><h3>写真 <small>スマホならその場で撮影できます</small></h3>
        <div class="photo-box">
          <div class="photo-prev" id="e-photo-prev">${r.photo?`<img src="${r.photo}" alt="">`:"写真なし"}</div>
          <div class="photo-actions">
            <label class="btn primary" style="text-align:center">📷 写真を撮る<input type="file" accept="image/*" capture="environment" id="e-cam" class="hidden"></label>
            <label class="btn" style="text-align:center">🖼 アルバムから選ぶ<input type="file" accept="image/*" id="e-file" class="hidden"></label>
            <button class="btn danger sm" data-act="photo-del">写真を外す</button>
          </div>
        </div>
      </div>

      <div class="sec"><h3>材料と原価 <small>原価は「その分量の仕入れ値」を入力</small></h3>
        <table class="itable"><thead><tr><th>材料名</th><th>English</th><th class="num">分量</th><th>単位</th><th class="num">原価（${esc(state.settings.currency)}）</th><th></th></tr></thead>
        <tbody id="e-ings">${r.ingredients.map(ingRow).join("")}</tbody></table>
        <button class="btn sm" data-act="ing-add" style="margin-top:8px">＋ 材料を追加</button>
        <div class="row" style="margin-top:12px">
          <label class="f">このレシピで何人前できる？<input id="e-yield" value="${esc(r.yield)}" inputmode="decimal" placeholder="1"></label>
          <label class="f">その他の原価（1皿あたり：容器・包材など）<input id="e-extra" value="${esc(r.extraCost)}" inputmode="decimal" placeholder="0"></label>
          <label class="f">売値（1皿・${esc(state.settings.currency)}）<input id="e-price" value="${esc(r.price)}" inputmode="decimal" placeholder="例：12.00"></label>
        </div>
        <div class="totals" id="e-totals"></div>
      </div>

      <div class="sec"><h3>作り方 <small>Method</small></h3>
        <div class="list-edit" id="e-steps">${r.steps.map(stepRow).join("")}</div>
        <button class="btn sm" data-act="step-add" style="margin-top:8px">＋ 手順を追加</button>
      </div>

      <div class="sec"><h3>提供時に必要なもの <small>お皿・付け合わせ・カトラリーなど</small></h3>
        <div class="list-edit" id="e-serv">${r.serving.map(servRow).join("")}</div>
        <button class="btn sm" data-act="serv-add" style="margin-top:8px">＋ 追加</button>
      </div>

      <div class="sec"><h3>アレルギー・メモ</h3>
        <label class="f" style="margin-bottom:10px">アレルギー表示<input id="e-allergen" value="${esc(r.allergens)}" placeholder="例：小麦、卵、大豆"></label>
        <label class="f">メモ（コツ・保存方法など）<textarea id="e-notes">${esc(r.notes)}</textarea></label>
      </div>
      <button class="btn primary" data-act="save" style="width:100%;padding:14px">保存する</button>
    </div>`);

  const ed = $("#ed");
  // Pull current form values into r
  function collect(){
    r.nameJa = $("#e-nameJa").value.trim(); r.nameEn = $("#e-nameEn").value.trim();
    r.category = $("#e-cat").value; r.prepTime = $("#e-time").value.trim();
    r.yield = $("#e-yield").value.trim(); r.extraCost = $("#e-extra").value.trim(); r.price = $("#e-price").value.trim();
    r.allergens = $("#e-allergen").value.trim(); r.notes = $("#e-notes").value;
    r.ingredients = [...ed.querySelectorAll("#e-ings tr")].map(tr => {
      const o = {}; tr.querySelectorAll("[data-f]").forEach(i=>o[i.dataset.f]=i.value.trim()); return o;
    });
    r.steps = [...ed.querySelectorAll("#e-steps .step")].map(d => ({ ja: $("[data-f=ja]",d).value.trim(), en: $("[data-f=en]",d).value.trim() }));
    r.serving = [...ed.querySelectorAll("#e-serv [data-f=serv]")].map(i=>i.value.trim());
  }
  function totals(){
    collect(); const c = calc(r);
    $("#e-totals").innerHTML = `
      <div class="tot"><div class="k">材料の合計</div><div class="v">${money(c.ingCost)}</div></div>
      <div class="tot"><div class="k">1皿の原価</div><div class="v">${money(c.cost)}</div></div>
      <div class="tot"><div class="k">原価率</div><div class="v">${isFinite(c.rate)?`<span class="pill ${rateClass(c.rate)}" style="font-size:16px">${pct(c.rate)}</span>`:"—"}</div></div>
      <div class="tot"><div class="k">利益（1皿）</div><div class="v">${c.price?money(c.profit):"—"}</div></div>`;
  }
  function rerenderLists(){
    $("#e-ings").innerHTML = r.ingredients.map(ingRow).join("");
    $("#e-steps").innerHTML = r.steps.map(stepRow).join("");
    $("#e-serv").innerHTML = r.serving.map(servRow).join("");
    totals();
  }
  totals();
  ed.addEventListener("input", totals);

  async function onPhoto(e){
    const f = e.target.files?.[0]; if (!f) return;
    try{ r.photo = await fileToDataURL(f); $("#e-photo-prev").innerHTML = `<img src="${r.photo}" alt="">`; }
    catch(err){ alert(err.message); }
    e.target.value = "";
  }
  $("#e-cam").addEventListener("change", onPhoto);
  $("#e-file").addEventListener("change", onPhoto);

  $("#sheet").onclick = async e => {
    if (e.target.id === "sheet") return;
    const btn = e.target.closest("[data-act]"); if (!btn) return;
    const a = btn.dataset.act, idx = +btn.closest("[data-i]")?.dataset.i;
    if (a==="cancel"){ if (confirm("保存せずに閉じますか？")) { closeSheet(); } return; }
    collect();
    if (a==="photo-del"){ r.photo=""; $("#e-photo-prev").textContent="写真なし"; return; }
    if (a==="ing-add"){ r.ingredients.push({name:"",nameEn:"",qty:"",unit:"",cost:""}); rerenderLists(); ed.querySelector(`#e-ings tr:last-child input`).focus(); return; }
    if (a==="ing-del"){ r.ingredients.splice(idx,1); if(!r.ingredients.length) r.ingredients.push({name:"",nameEn:"",qty:"",unit:"",cost:""}); rerenderLists(); return; }
    if (a==="step-add"){ r.steps.push({ja:"",en:""}); rerenderLists(); ed.querySelector(`#e-steps .step:last-child textarea`).focus(); return; }
    if (a==="step-del"){ r.steps.splice(idx,1); if(!r.steps.length) r.steps.push({ja:"",en:""}); rerenderLists(); return; }
    if (a==="step-up" && idx>0){ [r.steps[idx-1],r.steps[idx]]=[r.steps[idx],r.steps[idx-1]]; rerenderLists(); return; }
    if (a==="step-down" && idx<r.steps.length-1){ [r.steps[idx+1],r.steps[idx]]=[r.steps[idx],r.steps[idx+1]]; rerenderLists(); return; }
    if (a==="serv-add"){ r.serving.push(""); rerenderLists(); ed.querySelector(`#e-serv > div:last-child input`).focus(); return; }
    if (a==="serv-del"){ r.serving.splice(idx,1); if(!r.serving.length) r.serving.push(""); rerenderLists(); return; }
    if (a==="save"){
      if (!r.nameJa && !r.nameEn){ alert("料理名を入力してください"); $("#e-nameJa").focus(); return; }
      r.ingredients = r.ingredients.filter(i=>i.name||i.nameEn||i.qty||i.cost);
      r.steps = r.steps.filter(s=>s.ja||s.en);
      r.serving = r.serving.filter(Boolean);
      r.updatedAt = Date.now();
      try{ await Store.put(r); }catch(err){ alert("保存できませんでした：" + err.message); return; }
      const i = state.recipes.findIndex(x=>x.id===r.id);
      if (i>=0) state.recipes[i]=r; else state.recipes.push(r);
      render(); showDetail(r.id); toast("保存しました");
    }
  };
}

};
function pageHTML(r){
  const s = state.settings, c = calc(r), cat = catOf(r.category);

  return `<section class="pg">

          <div><span>原価 Cost</span><span class="r">${money(c.cost)}</span></div>

          <div class="big"><span>原価率 Cost %</span><span class="r">${pct(c.rate)}</span></div>
          ${c.yieldN>1?`<div class="muted"><span>仕込み量 Yield</span><span class="r">${c.yieldN} portions</span></div>`:""}
        </div>`:""}
        ${r.prepTime?`<div style="margin-top:3pt"><b>調理時間 Time:</b> ${esc(r.prepTime)}</div>`:""}
        ${r.allergens?`<div style="margin-top:3pt"><b>アレルギー Allergens:</b> ${esc(r.allergens)}</div>`:""}
        ${(r.serving||[]).filter(Boolean).length?`<h4>提供時に必要なもの / PLATING</h4><ul class="serve">${r.serving.filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
      </div>
    </div>

      ${ings.map(i=>`<tr><td>${esc(i.name)}${i.nameEn?` <span class="muted">/ ${esc(i.nameEn)}</span>`:""}</td><td class="r">${esc(i.qty)} ${esc(i.unit)}</td>${showCost?`<td class="r">${i.cost!==""&&i.cost!=null?money(i.cost):""}</td>`:""}</tr>`).join("")}

    ${r.notes?`<h4>メモ / NOTES</h4><div style="white-space:pre-wrap">${esc(r.notes)}</div>`:""}
    <div class="p-foot"><span>${esc(s.shop)}</span><span>更新 ${new Date(r.updatedAt||Date.now()).toLocaleDateString()}</span></div>
  </section>`;
}
function printRecipes(list){
  if (!list.length) return toast("印刷するレシピを選んでください");
  $("#page-size").textContent = (PAPERS[state.settings.paper]||PAPERS.half).css;
  const root = $("#print-root");
  root.innerHTML = list.map(pageHTML).join("");
  const imgs = [...root.querySelectorAll("img")];
  Promise.all(imgs.map(i => i.complete ? 0 : new Promise(r=>{i.onload=i.onerror=r;}))).then(() => {
    setTimeout(() => window.print(), 50);
  });
}
window.addEventListener("afterprint", () => { $("#print-root").innerHTML = ""; });

/* ============================================================
   Settings
   ============================================================ */
function showSettings(){
  const s = structuredClone(state.settings);
  const catRow = (c, i) => `<div class="cat-row" data-i="${i}">
    <input class="inp" data-f="ja" value="${esc(c.ja)}" placeholder="日本語名">
    <input class="inp" data-f="en" value="${esc(c.en)}" placeholder="English">
    <button class="btn sm" data-act="cat-up">▲</button><button class="btn sm" data-act="cat-down">▼</button>
    <button class="btn sm danger" data-act="cat-del">削除</button></div>`;
  openSheet(`
    <div class="sheet-head"><button class="btn icon" data-act="close">✕</button><h2>設定</h2><button class="btn primary" data-act="save">保存</button></div>
    <div class="sheet-body" id="st">
      <div class="sec"><h3>お店の情報・お金</h3>
        <div class="row">
          <label class="f">店名（印刷の下に入ります）<input id="s-shop" value="${esc(s.shop)}" placeholder="例：Sakura Kitchen"></label>
          <label class="f">通貨<select id="s-cur">
            <option value="$|2" ${s.currency==="$"?"selected":""}>$ ドル（小数2桁）</option>
            <option value="¥|0" ${s.currency==="¥"?"selected":""}>¥ 円</option>
            <option value="€|2" ${s.currency==="€"?"selected":""}>€ ユーロ</option></select></label>
          <label class="f">目標の原価率（%）<input id="s-target" value="${esc(s.targetRate)}" inputmode="decimal"></label>
        </div>
      </div>
      <div class="sec"><h3>印刷</h3>
        <div class="row">
          <label class="f">用紙サイズ<select id="s-paper">${Object.entries(PAPERS).map(([k,v])=>`<option value="${k}" ${s.paper===k?"selected":""}>${v.label}</option>`).join("")}</select></label>
          <label class="f">原価を印刷する？<select id="s-pcost"><option value="1" ${s.printCost?"selected":""}>印刷する</option><option value="0" ${!s.printCost?"selected":""}>印刷しない（スタッフ用）</option></select></label>
        </div>
      </div>
      <div class="sec"><h3>カテゴリー <small>増やす・名前を変える・並べ替え</small></h3>
        <div id="s-cats">${s.categories.map(catRow).join("")}</div>
        <button class="btn sm" data-act="cat-add">＋ カテゴリーを追加</button>
      </div>
      <div class="sec"><h3>バックアップ・他の端末へ移す</h3>
        <p style="margin:0 0 10px;color:var(--muted);font-size:13px">レシピはこの端末のブラウザに保存されます。定期的に「書き出し」して保存しておくと安心です。別のパソコン・iPadに移すときは、書き出したファイルを「読み込み」してください。</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" data-act="export">⬇ 書き出し（バックアップ）</button>
          <button class="btn" data-act="import">⬆ 読み込み</button>
        </div>
      </div>
      <div class="sec"><h3>AI読み取り <small>写真からレシピを作る機能</small></h3>
        <p style="margin:0 0 10px;color:var(--muted);font-size:13px">手書きや印刷のレシピの写真を読み取るには、Claude の APIキーが必要です。<a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a> で作成して、ここに貼り付けてください。キーはこの端末の中だけに保存され、バックアップファイルには入りません。</p>
        <label class="f">APIキー<input id="s-key" type="password" autocomplete="off" placeholder="sk-ant-..." value="${esc(apiKeyCache)}"></label>
      </div>
      <div class="sec"><h3>表示</h3>
        <label class="f">画面の明るさ<select id="s-theme"><option value="auto" ${s.theme==="auto"?"selected":""}>端末に合わせる</option><option value="light" ${s.theme==="light"?"selected":""}>ライト</option><option value="dark" ${s.theme==="dark"?"selected":""}>ダーク</option></select></label>
      </div>
    </div>`);
  const st = $("#st");
  function collect(){
    s.shop = $("#s-shop").value.trim();
    const [cur, dec] = $("#s-cur").value.split("|"); s.currency = cur; s.decimals = +dec;
    s.targetRate = num($("#s-target").value) || 30;
    s.paper = $("#s-paper").value; s.printCost = $("#s-pcost").value === "1"; s.theme = $("#s-theme").value;
    s.categories = [...st.querySelectorAll(".cat-row")].map((d,i) => ({ id: s.categories[i]?.id || uid(), ja: $("[data-f=ja]",d).value.trim(), en: $("[data-f=en]",d).value.trim() }));
  }
  const redrawCats = () => { $("#s-cats").innerHTML = s.categories.map(catRow).join(""); };
  $("#sheet").onclick = async e => {
    if (e.target.id === "sheet") return closeSheet();
    const btn = e.target.closest("[data-act]"); if (!btn) return;
    const a = btn.dataset.act, i = +btn.closest("[data-i]")?.dataset.i;
    if (a==="close") return closeSheet();
    collect();
    if (a==="cat-add"){ s.categories.push({ id: uid(), ja:"", en:"" }); redrawCats(); st.querySelector(".cat-row:last-child input").focus(); }
    if (a==="cat-up" && i>0){ [s.categories[i-1],s.categories[i]]=[s.categories[i],s.categories[i-1]]; redrawCats(); }
    if (a==="cat-down" && i<s.categories.length-1){ [s.categories[i+1],s.categories[i]]=[s.categories[i],s.categories[i+1]]; redrawCats(); }
    if (a==="cat-del"){
      const used = state.recipes.filter(r=>r.category===s.categories[i].id).length;
      if (used && !confirm(`このカテゴリーには ${used} 件のレシピがあります。削除すると「未分類」になります。よろしいですか？`)) return;
      s.categories.splice(i,1); redrawCats();
    }
    if (a==="export") exportData();
    if (a==="import") $("#file-import").click();
    if (a==="save"){
      s.categories = s.categories.filter(c=>c.ja||c.en);
      state.settings = s; await Store.setKV("settings", s); applyTheme();
      apiKeyCache = $("#s-key").value.trim(); await Store.setKV("apiKey", apiKeyCache);
      if (state.cat!=="all" && !s.categories.some(c=>c.id===state.cat)) state.cat="all";
      closeSheet(); render(); toast("設定を保存しました");
    }
  };
}
function applyTheme(){
  const t = state.settings.theme;
  if (t==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
}

/* ============================================================
   Backup / restore
   ============================================================ */
function exportData(){
  const data = { app:"recipe-book", version:1, exportedAt:new Date().toISOString(), settings: state.settings, recipes: state.recipes };
  const blob = new Blob([JSON.stringify(data)], { type:"application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `recipes-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  toast("書き出しました");
}
$("#file-import").addEventListener("change", async e => {
  const f = e.target.files?.[0]; e.target.value = ""; if (!f) return;
  try{
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.recipes)) throw new Error("レシピのバックアップファイルではありません");
    if (!confirm(`${data.recipes.length} 件のレシピを読み込みます。\n同じレシピは上書きされます。よろしいですか？`)) return;
    if (data.settings){
      const cats = [...state.settings.categories];
      (data.settings.categories||[]).forEach(c => { if (!cats.some(x=>x.id===c.id)) cats.push(c); });
      state.settings = { ...state.settings, ...data.settings, categories: cats };
      await Store.setKV("settings", state.settings); applyTheme();
    }
    for (const r of data.recipes){ await Store.put(r); }
    state.recipes = await Store.all();
    closeSheet(); render(); toast(`${data.recipes.length} 件を読み込みました`);
  }catch(err){ alert("読み込めませんでした：" + err.message); }
});

/* ============================================================
   AI: read recipe photos (handwritten / printed) into a recipe
   ============================================================ */
let apiKeyCache = "";
const SDK_URL = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.128.0/+esm";
const SCAN_MODEL = "claude-opus-5-5";
function scanSchema(){
  const str = { type:"string" };
  return {
    type:"object", additionalProperties:false,
    required:["nameJa","nameEn","category","prepTime","yield","price","allergens","notes","ingredients","steps","serving"],
    properties:{
      nameJa:str, nameEn:str,
      category:{ type:"string", enum:[...state.settings.categories.map(c=>c.id), ""] },
      prepTime:str, yield:str, price:str, allergens:str, notes:str,
      ingredients:{ type:"array", items:{ type:"object", additionalProperties:false,
        required:["name","nameEn","qty","unit","cost"],
        properties:{ name:str, nameEn:str, qty:str, unit:str, cost:str } } },
      steps:{ type:"array", items:{ type:"object", additionalProperties:false, required:["ja","en"], properties:{ ja:str, en:str } } },
      serving:{ type:"array", items:str }
    }
  };
}
function scanPrompt(){
  const cats = state.settings.categories.map(c=>`- ${c.id}: ${c.ja} / ${c.en}`).join("\n");
  return `These photos show one restaurant kitchen recipe, handwritten or printed, mostly in Japanese. Read everything and fill in the recipe fields.

Rules:
- Copy the Japanese text faithfully. Fix obvious reading mistakes only when the meaning is clear.
- nameEn, ingredients[].nameEn and steps[].en: translate into natural kitchen English for staff.
- qty: number only when possible (e.g. "200"); unit: g, ml, 個, 本, 大さじ, tbsp, etc.
- cost and price: numbers only, no currency sign. Use "" when the photo does not show them. Never guess money.
- yield: number of portions this recipe makes; "1" if not written.
- serving: plates, garnishes, sauces and tools needed when serving the dish.
- category: pick the best match from this list, or "" if none fits:
${cats}
- Put anything that does not fit (tips, storage, shelf life) in notes, in Japanese.
- If a field is not in the photo, use "" or an empty list.`;
}
async function readRecipePhotos(images){
  if (!apiKeyCache) throw new Error("APIキーが設定されていません。「設定」→「AI読み取り」で入力してください。");
  let Anthropic;
  try{ ({ default: Anthropic } = await import(SDK_URL)); }
  catch{ throw new Error("AIの部品を読み込めませんでした。インターネット接続を確認してください。"); }
  const client = new Anthropic({ apiKey: apiKeyCache, dangerouslyAllowBrowser: true });
  let res;
  try{
    res = await client.beta.messages.create({
      model: SCAN_MODEL,
      max_tokens: 16000,
      betas: ["server-side-fallback-2026-07-01"],
      fallbacks: "default",
      output_config: { effort: "medium", format: { type: "json_schema", schema: scanSchema() } },
      messages: [{ role: "user", content: [
        ...images.map(d => ({ type:"image", source:{ type:"base64", media_type:"image/jpeg", data: d.split(",")[1] } })),
        { type:"text", text: scanPrompt() }
      ]}]
    });
  }catch(err){
    if (err instanceof Anthropic.AuthenticationError) throw new Error("APIキーが正しくありません。設定を確認してください。");
    if (err instanceof Anthropic.RateLimitError) throw new Error("混み合っています。少し待ってからもう一度お試しください。");
    if (err instanceof Anthropic.APIConnectionError) throw new Error("通信できませんでした。インターネット接続を確認してください。");
    if (err instanceof Anthropic.APIError) throw new Error(`AIの読み取りに失敗しました（${err.status ?? "?"}）：${err.message}`);
    throw err;
  }
  if (res.stop_reason === "refusal") throw new Error("この写真は読み取れませんでした。別の写真でお試しください。");
  if (res.stop_reason === "max_tokens") throw new Error("レシピが長すぎて途中で止まりました。写真を分けて読み取ってください。");
  const text = res.content.filter(b=>b.type==="text").map(b=>b.text).join("");
  try{ return JSON.parse(text); }
  catch{ throw new Error("読み取り結果を整理できませんでした。もう一度お試しください。"); }
}
function showScan(){
  const imgs = [];
  openSheet(`
    <div class="sheet-head"><button class="btn icon" data-act="close">✕</button><h2>写真からレシピを作る</h2></div>
    <div class="sheet-body" id="scan">
      <div class="sec">
        <p style="margin:0 0 10px">手書きや印刷のレシピ（材料・作り方など）を撮影してください。複数ページあれば全部追加できます。AIが読み取って、入力画面に自動で書き込みます。</p>
        ${apiKeyCache?"":`<p class="note" style="margin:0 0 10px">先に「⚙︎ 設定」→「AI読み取り」でAPIキーを入れてください。</p>`}
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <label class="btn primary">📷 撮影する<input type="file" accept="image/*" capture="environment" id="scan-cam" class="hidden"></label>
          <label class="btn">🖼 アルバムから選ぶ<input type="file" accept="image/*" multiple id="scan-file" class="hidden"></label>
        </div>
        <div class="scan-thumbs" id="scan-thumbs"></div>
        <button class="btn primary" data-act="run" id="scan-run" style="width:100%;padding:14px" disabled>読み取ってレシピにする</button>
      </div>
      <div class="sec hidden" id="scan-busy" style="text-align:center">
        <div class="spinner"></div><b>読み取り中…</b><div style="color:var(--muted);font-size:13px">30秒〜1分ほどかかります</div>
      </div>
    </div>`);
  const draw = () => {
    $("#scan-thumbs").innerHTML = imgs.map((d,i)=>`<figure data-i="${i}"><img src="${d}" alt="${i+1}ページ目"><button data-act="rm" title="外す">×</button></figure>`).join("");
    $("#scan-run").disabled = !imgs.length;
  };
  async function add(e){
    for (const f of e.target.files || []){
      try{ imgs.push(await fileToDataURL(f, 1600, 0.85)); }catch(err){ alert(err.message); }
    }
    e.target.value = ""; draw();
  }
  $("#scan-cam").addEventListener("change", add);
  $("#scan-file").addEventListener("change", add);
  $("#sheet").onclick = async e => {
    if (e.target.id === "sheet") return closeSheet();
    const btn = e.target.closest("[data-act]"); if (!btn) return;
    const a = btn.dataset.act;
    if (a==="close") return closeSheet();
    if (a==="rm"){ imgs.splice(+btn.closest("[data-i]").dataset.i, 1); draw(); return; }
    if (a==="run"){
      $("#scan-run").disabled = true; $("#scan-busy").classList.remove("hidden");
      try{
        const d = await readRecipePhotos(imgs);
        const r = { ...blankRecipe(), ...d };
        if (!r.category) r.category = blankRecipe().category;
        if (!r.ingredients.length) r.ingredients = blankRecipe().ingredients;
        if (!r.steps.length) r.steps = blankRecipe().steps;
        if (!r.serving.length) r.serving = [""];
        toast("読み取りました。内容を確認して保存してください");
        showEditor(r, true);
      }catch(err){
        $("#scan-busy").classList.add("hidden"); $("#scan-run").disabled = false;
        alert(err.message);
      }
    }
  };
}

/* ============================================================
   Events
   ============================================================ */
$("#tabs").addEventListener("click", e => { const t = e.target.closest("[data-cat]"); if (!t) return; state.cat = t.dataset.cat; render(); });
$("#q").addEventListener("input", e => { state.q = e.target.value; renderGrid(); });
$("#grid").addEventListener("click", e => {
  const card = e.target.closest(".card"); if (!card) return;
  const id = card.dataset.id;
  if (state.selecting){ state.picked.has(id) ? state.picked.delete(id) : state.picked.add(id); renderGrid(); }
  else showDetail(id);
});
$("#btn-new").addEventListener("click", () => showEditor(null, true));
$("#btn-scan").addEventListener("click", showScan);
$("#btn-settings").addEventListener("click", showSettings);
$("#btn-sample").addEventListener("click", addSamples);
$("#btn-select").addEventListener("click", () => {
  state.selecting = !state.selecting; state.picked.clear();
  if (state.selecting) filtered().forEach(r=>state.picked.add(r.id));
  renderGrid();
  if (state.selecting) toast("表示中のレシピを全部選びました。タップで外せます");
});
$("#btn-print-sel").addEventListener("click", () => {
  const list = filtered().filter(r=>state.picked.has(r.id));
  printRecipes(list);
});

/* ============================================================
   Boot
   ============================================================ */
(async function boot(){
  try{
    const saved = await Store.getKV("settings");
    if (saved) state.settings = { ...DEFAULT_SETTINGS, ...saved };
    state.recipes = (await Store.all()) || [];
    apiKeyCache = (await Store.getKV("apiKey")) || "";
  }catch(e){ useMem = true; }
  applyTheme(); render();
  if (useMem) toast("この画面では保存ができません。ブラウザで直接開いてください");
})();
</script>
